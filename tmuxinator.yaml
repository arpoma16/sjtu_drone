name: drone-sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: tiled
      panes:
        - sim:
            - ./run_docker2.sh
        - bridge:
            - sleep 3
            - docker exec -it sjtu_drone bash --login;
            - source /opt/ros/iron/setup.bash
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml
        - aux:
            - sleep 4
            - docker exec -it sjtu_drone bash --login;
            - source /opt/ros/iron/setup.bash
            - ros2 topic list
